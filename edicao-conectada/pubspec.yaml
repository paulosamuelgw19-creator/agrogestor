name: agrogestao
description: Gestão de máquinas, serviços e manutenção agrícola.
publish_to: 'none'
version: 2.1.6+2015

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  dio: ^5.11.1
  archive: 4.0.9
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  workmanager: ^0.10.10
  flutter_map: 8.3.2
  latlong2: 0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: 2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
